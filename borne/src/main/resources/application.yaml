spring:
  application:
    name: borne
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/borne}
    username: ${DB_USERNAME:borne}
    password: ${DB_PASSWORD:borne}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

borne:
  id: ${BORNE_ID:borne-1}
  power-kw: ${BORNE_POWER_KW:7.2}
  water-flow-lpm: ${BORNE_WATER_FLOW_LPM:12}

pricing:
  electricity:
    tier-one-limit: ${ELECTRICITY_TIER_ONE_LIMIT:10}
    tier-two-limit: ${ELECTRICITY_TIER_TWO_LIMIT:20}
    tier-one-rate: ${ELECTRICITY_TIER_ONE_RATE:0.30}
    tier-two-rate: ${ELECTRICITY_TIER_TWO_RATE:0.45}
    tier-three-rate: ${ELECTRICITY_TIER_THREE_RATE:0.60}
  water:
    tier-one-limit: ${WATER_TIER_ONE_LIMIT:100}
    tier-two-limit: ${WATER_TIER_TWO_LIMIT:500}
    tier-one-rate: ${WATER_TIER_ONE_RATE:0.002}
    tier-two-rate: ${WATER_TIER_TWO_RATE:0.003}
    tier-three-rate: ${WATER_TIER_THREE_RATE:0.005}
