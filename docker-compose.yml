services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: soa-mosquitto
    user: "0:0"
    environment:
      MQTT_USER: ${MQTT_USER:-management}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-change-me}
      MQTT_BORNE_PASSWORD: ${MQTT_BORNE_PASSWORD:-change-me}
    entrypoint: ["/bin/sh", "-c"]
    command: ["rm -f /mosquitto/data/passwd; mosquitto_passwd -b -c /mosquitto/data/passwd \"$${MQTT_USER}\" \"$${MQTT_PASSWORD}\"; for i in $$(seq -w 1 100); do mosquitto_passwd -b /mosquitto/data/passwd \"B$$i\" \"$${MQTT_BORNE_PASSWORD}\"; done; chmod 644 /mosquitto/data/passwd; exec mosquitto -c /mosquitto/config/mosquitto.conf"]
    volumes:
      - ./mosquitto:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -u \"$${MQTT_USER}\" -P \"$${MQTT_PASSWORD}\" -t soa/v1/healthcheck -n >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soa-network
  postgres:
    image: postgres:16
    container_name: soa-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-borne}
      POSTGRES_USER: ${POSTGRES_USER:-borne}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5433:5432"
    volumes:
      - borne-postgres-data:/var/lib/postgresql/data
    networks:
      - soa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migration:
    image: ${BORNE_IMAGE:-soa-borne:local}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - soa-network
    entrypoint: ["java", "-jar", "/app/app.jar", "--server.port=8090", "--spring.main.web-application-type=none"]
    environment:
      DB_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-borne}
      DB_USERNAME: ${POSTGRES_USER:-borne}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      BORNE_ID: migration
      FLYWAY_ENABLED: "true"
      BORNE_INITIALIZER_ENABLED: "false"
      MQTT_ENABLED: "false"
    restart: "no"

  management:
    build: ./management
    container_name: soa-management
    environment:
      DB_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-borne}
      DB_USERNAME: ${POSTGRES_USER:-borne}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      DOCKER_NETWORK: ${DOCKER_NETWORK:-soa-network}
      BORNE_IMAGE: ${BORNE_IMAGE:-soa-borne:local}
      DOCKER_HOST: unix:///var/run/docker.sock
      MANAGEMENT_ADMIN_USERNAME: ${MANAGEMENT_ADMIN_USERNAME:-admin}
      MANAGEMENT_ADMIN_PASSWORD: ${MANAGEMENT_ADMIN_PASSWORD:-change-me}
      MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_USERNAME: ${MQTT_USER:-management}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-change-me}
      MQTT_BORNE_PASSWORD: ${MQTT_BORNE_PASSWORD:-change-me}
      WEBSOCKET_ALLOWED_ORIGINS: ${WEBSOCKET_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:14200}
    ports:
      - "8081:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - soa-network

  gateway:
    build: ./gateway
    container_name: soa-gateway
    environment:
      MANAGEMENT_HOST: management
      MANAGEMENT_PORT: 8081
      MANAGEMENT_USERNAME: ${MANAGEMENT_ADMIN_USERNAME:-admin}
      MANAGEMENT_PASSWORD: ${MANAGEMENT_ADMIN_PASSWORD:-change-me}
      GATEWAY_USERNAME: ${GATEWAY_USERNAME:-admin}
      GATEWAY_PASSWORD: ${GATEWAY_PASSWORD:-change-me}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      management:
        condition: service_started
    networks:
      - soa-network

  dashboard:
    build: ./dashboard
    container_name: soa-dashboard
    ports:
      - "${DASHBOARD_PORT:-4200}:80"
    environment:
      DASHBOARD_WS_USERNAME: ${DASHBOARD_WS_USERNAME:-viewer}
      DASHBOARD_WS_PASSWORD: ${DASHBOARD_WS_PASSWORD:-viewer}
      DASHBOARD_API_USERNAME: ${DASHBOARD_API_USERNAME:-admin}
      DASHBOARD_API_PASSWORD: ${DASHBOARD_API_PASSWORD:-change-me}
    depends_on:
      - gateway
    networks:
      - soa-network

volumes:
  borne-postgres-data:
  mosquitto-data:
  mosquitto-log:

networks:
  soa-network:
    name: ${DOCKER_NETWORK:-soa-network}
